name: CI Test Suite

on:
  schedule:
    # Run at midnight UTC every day
    - cron: '0 0 * * *'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch: # Allow manual triggering

# Read-only token: `npm ci` runs dependency install scripts, which must never get write access
permissions:
  contents: read

jobs:
  # Hermetic tests: @qlik/api is stubbed, so no secrets or tenant are needed.
  hermetic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run hermetic browser tests (stub server)
        run: npm run test:browser

      - name: Upload browser test report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-browser-${{ github.run_number }}
          path: playwright-report-browser/
          retention-days: 7

  # Live end-to-end tests against the Qlik Cloud tenant configured in the `env` secret.
  # Runs only after the hermetic job passes, so a failing PR doesn't spend tenant calls or login rate-limit quota.
  test:
    needs: hermetic
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Written after installs so dependency install scripts can't read the secrets
      - name: Download environment file
        run: |
          # Use here-document to safely handle special characters
          cat > .env << 'EOF'
          ${{ secrets.env }}
          EOF
          echo "Environment file downloaded from secrets"

      - name: Run Playwright tests
        run: npx playwright test --reporter=html
      
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30
      
      - name: Upload test videos and screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-evidence-${{ github.run_number }}
          path: test-results/
          retention-days: 7
      
      - name: Cleanup environment file
        if: always()
        run: |
          rm -f .env
          echo "Environment file cleaned up"
      
      - name: Generate test summary
        if: always()
        run: |
          echo "## Nightly Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run Date**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: http://localhost:3000 (local instance)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "playwright-report/index.html" ]; then
            echo "Test report generated successfully" >> $GITHUB_STEP_SUMMARY
            echo "[View Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "Test report not found" >> $GITHUB_STEP_SUMMARY
          fi
