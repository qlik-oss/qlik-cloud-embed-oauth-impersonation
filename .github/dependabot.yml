version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3          # only propose versions published ≥3 days ago
    allow:
      - dependency-type: all
    groups:
      npm-version-updates:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions-version-updates:
        applies-to: version-updates
        patterns: ["*"]
